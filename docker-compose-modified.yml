version: '3.8'

services:
  db:
    image: postgres:16
    container_name: edrp_db
    environment:
      POSTGRES_DB: edrp
      POSTGRES_USER: edrp
      POSTGRES_PASSWORD: edrp2025
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  app:
    build: .
    container_name: edrp_app
    network_mode: "host"  # Use host networking to avoid Docker network isolation issues
    environment:
      - DATABASE_URL=postgresql://edrp:edrp2025@localhost:5432/edrp
      - SECRET_KEY=1b5aaf1d96e1a8b1419885bff22546cbdc0dd4b4962879e91c876803bc443391
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ROOT_DOMAIN=localhost
      - ENVIRONMENT=development
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
