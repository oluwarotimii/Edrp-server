databases:
  - name: schoolmaster-db
    plan: free

services:
  - type: web
    name: schoolmaster-api
    env: python
    pythonVersion: '3.11'
    buildCommand: poetry install && poetry run alembic upgrade head
    startCommand: poetry run uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schoolmaster-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
